---
- name: Подготовка хоста к установке FreeIPA
  ansible.builtin.import_tasks: install_common.yml

- name: Дождаться LDAP и HTTPS первой реплики
  ansible.builtin.wait_for:
    host: "{{ groups['ipa_primary'][0] }}"
    port: "{{ item }}"
    timeout: 180
    state: started
  loop:
    - 53
    - 389
    - 443
    - 8443
  loop_control:
    label: "{{ groups['ipa_primary'][0] }}:{{ item }}"

- name: Установить реплику
  when: not freeipa_installed_conf.stat.exists
  block:
    - name: ipa-replica-install
      ansible.builtin.command:
        argv: "{{ _ipa_replica_cmd + (['--setup-ca'] if freeipa_setup_ca_on_replicas | bool else []) + freeipa_install_dns_args }}"
      vars:
        _ipa_replica_cmd:
          - /usr/sbin/ipa-replica-install
          - --unattended
          - "--server={{ groups['ipa_primary'][0] }}"
          - "--realm={{ freeipa_realm }}"
          - "--domain={{ freeipa_domain }}"
          - --principal=admin
          - "--admin-password={{ freeipa_admin_password }}"
          - "--ip-address={{ freeipa_ip_address }}"
          - --setup-dns
      no_log: "{{ not (freeipa_install_debug | bool) }}"
      changed_when: true
  rescue:
    - name: Хвост журнала неудачной реплики
      ansible.builtin.command: tail -n 80 /var/log/ipareplica-install.log
      register: freeipa_install_log
      changed_when: false
      failed_when: false
    - name: Показать журнал реплики
      ansible.builtin.debug:
        msg: "{{ freeipa_install_log.stdout_lines | default(['/var/log/ipareplica-install.log не найден']) | reject('search', '(?i)--(ds|admin)-password') | list }}"
    - name: Остановить playbook после ошибки реплики
      ansible.builtin.fail:
        msg: >-
          ipa-replica-install не выполнен. Журнал выше и
          /var/log/ipareplica-install.log. Перед повтором на этой машине:
          ipa-server-install --uninstall -U

- name: Реплика уже была установлена
  ansible.builtin.debug:
    msg: "На {{ inventory_hostname }} FreeIPA уже есть, ipa-replica-install пропущен."
  when: freeipa_installed_conf.stat.exists

- name: Дождаться служб реплики
  ansible.builtin.command: /usr/sbin/ipactl status
  register: freeipa_ipactl
  changed_when: false
  retries: 12
  delay: 10
  until: freeipa_ipactl.rc == 0 and 'STOPPED' not in freeipa_ipactl.stdout
