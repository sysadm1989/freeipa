[defaults]
inventory = inventory/hosts.yml
roles_path = roles
retry_files_enabled = False
forks = 5
stdout_callback = default

[ssh_connection]
# ipa-server-install долго молчит в stdout. Keepalive не даёт NAT оборвать SSH.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=240
